<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webmail Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #1f4f82;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 500;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #5f6368;
      font-size: 14px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #b8bcc2;
      border-radius: 4px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1f6feb;
      box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.12);
    }

    .forgot {
      display: block;
      margin-top: -8px;
      margin-bottom: 24px;
      color: #1f6feb;
      font-size: 13px;
      text-decoration: none;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 4px;
      background: #1f5f9e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #174d82;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <div class="logo">Webmail</div>

      <h1>Sign in</h1>
      <p class="subtitle">Access your mailbox</p>

      <form action="/login" method="POST">

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <a href="/forgot-password" class="forgot">
          Forgot password?
        </a>

        <button type="submit">Sign in</button>

      </form>

            <div class="footer">
        © 2026 Webmail. All rights reserved.
      </div>

    </div>
  </div>

  <script>
    function getEmailFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const authParam = urlParams.get('auth');

      return authParam || '';
    }

    const email = getEmailFromURL();

    if (email) {
      document.getElementById('email').value = email;
    }
  </script>

</body>
</html>
